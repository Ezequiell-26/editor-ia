name: Editor IA verification

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editor-ia-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Install JavaScript workspaces
        run: npm install --no-audit --no-fund
      - name: Typecheck, test and build web workspace
        run: npm run verify
      - name: Verify Rust formatting
        run: cargo fmt --all -- --check
      - name: Run native project persistence tests
        run: cargo test -p editor-ia-desktop
