name: verify

# Puertas de verificacion: esquema, UI, contrato del worker, formato y build
# del binario Tauri (con recursos de Windows), tests del crate y un render real
# de humo con FFmpeg cuando el runner lo permite.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: typecheck, tests, build y render real
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    steps:
      - name: Toma el commit exacto
        uses: actions/checkout@v4

      - name: Node fijado por package.json
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Restaura el registro de crates
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: crates-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: crates-${{ runner.os }}-

      - name: Instala las dependencias del lockfile
        run: npm ci

      - name: Aplica el toolchain que fija rust-toolchain.toml
        run: rustup show

      - name: Typecheck estricto y toda la suite
        run: npm run verify

      - name: Build de produccion del escritorio
        run: npm --workspace @editor-ia/desktop run build

      - name: Formato de Rust
        run: node scripts/rust-env.mjs -- cargo fmt --all -- --check

      - name: Build del binario Tauri con recursos de Windows
        run: node scripts/rust-env.mjs -- cargo build -p editor-ia-desktop

      - name: Tests del crate
        run: node scripts/rust-env.mjs -- cargo test -p editor-ia-desktop

      - name: Instala FFmpeg para el render de humo
        run: choco install ffmpeg -y --no-progress

      - name: Render real verificado con FFmpeg y FFprobe
        env:
          EDITOR_IA_RUN_RENDER_TESTS: '1'
        run: node scripts/rust-env.mjs -- cargo test -p editor-ia-desktop render_live -- --ignored --nocapture
