name: windows-package

# Construye el instalador NSIS real desde el codigo del commit y sube solo los
# artefactos generados. Si el bundle no existe, el job falla: nunca reporta un
# instalador que no se produjo.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    name: instalador Windows x64
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    steps:
      - name: Toma el commit exacto
        uses: actions/checkout@v4

      - name: Node fijado por package.json
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Restaura el registro de crates
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: crates-package-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: crates-package-${{ runner.os }}-

      - name: Instala las dependencias del lockfile
        run: npm ci

      - name: Prepara FFmpeg dev y libclang para video-rs
        run: bash scripts/ci-ffmpeg-dev.sh

      - name: Prepara recursos empaquetados (FFmpeg, yt-dlp, ONNX)
        run: bash scripts/ci-bundle-resources.sh

      - name: Verifica antes de empaquetar
        run: npm run verify

      - name: Auditoria de licencias del bundle antes de firmar/publicar
        run: npm run audit:licenses

      - name: Formato de Rust
        run: node scripts/rust-env.mjs -- cargo fmt --all -- --check

      - name: Compila el concat-worker de release
        # Debe existir ANTES de `tauri build`: tauri.conf.json lo declara como
        # resource y el bundler falla si el archivo no está.
        run: node scripts/rust-env.mjs -- cargo build --release --manifest-path apps/concat-worker/Cargo.toml

      - name: Verifica recursos declarados en tauri.conf.json
        # Chequeo estático barato: falla acá si falta cualquier fuente de
        # bundle.resources/icon en vez de romper el bundler a los 20 minutos.
        run: node scripts/check-bundle-resources.mjs

      - name: Construye el instalador NSIS sin firma
        run: node scripts/rust-env.mjs -- npm --workspace @editor-ia/desktop run tauri:build -- --no-sign

      - name: Comprueba que el instalador existe y no esta vacio
        run: |
          set -euo pipefail
          find target/release/bundle/nsis -maxdepth 1 -type f -name '*.exe' -size +1M -print
          test -n "$(find target/release/bundle/nsis -maxdepth 1 -type f -name '*.exe' -size +1M -print -quit)"

      - name: Avisa que el artefacto de tag no esta firmado
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "::warning::Este workflow genera un instalador SIN firma Authenticode. Para un release publico usá release.yml, que firma con WINDOWS_CERTIFICATE_* y rechaza publicar sin firma."

      - name: Publica el instalador exacto como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: editor-ia-windows-x64-unsigned
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
