name: windows-package

# Construye el instalador NSIS real desde el codigo del commit y sube solo los
# artefactos generados. Si el bundle no existe, el job falla: nunca reporta un
# instalador que no se produjo.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    name: instalador Windows x64
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    steps:
      - name: Toma el commit exacto
        uses: actions/checkout@v4

      - name: Node fijado por package.json
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Restaura el registro de crates
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: crates-package-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: crates-package-${{ runner.os }}-

      - name: Instala las dependencias del lockfile
        run: npm ci

      - name: Verifica antes de empaquetar
        run: npm run verify

      - name: Formato de Rust
        run: node scripts/rust-env.mjs -- cargo fmt --all -- --check

      - name: Construye el instalador NSIS
        run: node scripts/rust-env.mjs -- npm --workspace @editor-ia/desktop run tauri:build

      - name: Comprueba que el instalador existe y no esta vacio
        run: |
          set -euo pipefail
          find target/release/bundle/nsis -maxdepth 1 -type f -name '*.exe' -size +1M -print
          test -n "$(find target/release/bundle/nsis -maxdepth 1 -type f -name '*.exe' -size +1M -print -quit)"

      - name: Publica el instalador exacto como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: editor-ia-windows-x64
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
