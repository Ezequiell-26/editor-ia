version: 1

repowiki:
  template: architecture
  notes:
    - text: "Escribir la wiki en español; el producto, la UI y la documentación están en español."
    - text: "Editor IA es local-first: la edición, el proyecto, los medios y las claves se quedan en la máquina. Cualquier proveedor remoto es opcional y requiere consentimiento explícito; no describirlo como obligatorio."
    - text: "El contrato de datos es `.editoria.json` v1 en `packages/project-schema`. Si una página describe clips, assets, captions, keyframes o delivery, debe citar el esquema y no inventar campos."
    - text: "La app es Tauri 2 + React 19 + TypeScript estricto. La UI vive en `apps/desktop/src`; los comandos IPC allowlisted y el render viven en `apps/desktop/src-tauri/src`."
    - text: "El export es atómico: FFmpeg escribe a un temporal, FFprobe verifica y recién entonces se publica. Documentar ese orden; no afirmar escritura directa sobre el archivo final."
    - text: "El render worker (`apps/render-worker`) habla un protocolo propio. No confundirlo con el backend Rust ni con el motor FFmpeg de la app."
    - text: "Las extensiones Chrome MV3 (`extensions/flow-queue`, `extensions/web-tts-bridge`, `extensions/editor-ia-downloader`) son opcionales, se cargan sin empaquetar y tienen permisos acotados por host. No afirmar que están instaladas."
    - text: "Wav2Lip es solo personal/investigación/no comercial. El adaptador vive en `scripts/lipsync-engine`; el motor y los pesos quedan fuera del repo y no se empaquetan en la app."
    - text: "No hardcodear conteos de tests, tamaños de instalador ni hashes: cambian entre pasadas. Medir con `npm run verify` y `node scripts/rust-env.mjs -- cargo test --workspace`."
    - text: "El árbol de trabajo puede tener cambios sin commit sobre `781d9c1`. Describir el código fuente actual y aclarar que el remoto o el instalador pueden estar atrasados; no afirmar que un lote no commiteado fue publicado."
    - text: "No afirmar paridad total con CapCut o DaVinci ni generación real de Flow o ElevenLabs si no está verificada. Las brechas están en `docs/ROADMAP.md` y `docs/reference/EDITOR-PARITY-MATRIX-2026-10-19.md`."
    - text: "La app usa FFmpeg y FFprobe del sistema. En Windows, los tests Rust requieren `scripts/rust-env.mjs` por el toolchain MSVC; no sugerir `cargo test` pelado."
  documents:
    - title: "Visión general y estado verificado"
      goal: "Explicar qué es Editor IA, para quién es, qué funciones están verificadas y cuáles son límites o ideas no implementadas."
      hints: "README.md; docs/product/PRODUCT-SPEC.md; docs/ROADMAP.md"
    - title: "Arquitectura del sistema"
      goal: "Describir las capas: UI React, backend Tauri/Rust, render worker, esquema compartido y extensiones; incluir un diagrama de contenedores y los límites entre capas."
      hints: "package.json; apps/desktop; apps/desktop/src-tauri; apps/render-worker; packages/project-schema; extensions"
    - title: "Aplicación de escritorio"
      parent: "Arquitectura del sistema"
      goal: "Explicar el shell Tauri, las vistas, el estado del editor, el enrutado y cómo la UI consume los comandos IPC."
      hints: "apps/desktop/src/App.tsx; apps/desktop/src/pages; apps/desktop/src/state; apps/desktop/src/components"
    - title: "Backend Rust e IPC"
      parent: "Arquitectura del sistema"
      goal: "Documentar los comandos Tauri allowlisted, los módulos de commands/, la validación de entradas, el manejo de errores y los límites de seguridad."
      hints: "apps/desktop/src-tauri/src/commands; apps/desktop/src-tauri/src/lib.rs; apps/desktop/src-tauri/tauri.conf.json"
    - title: "Esquema de proyecto .editoria.json"
      parent: "Arquitectura del sistema"
      goal: "Describir el modelo de datos v1, la validación con Zod, los fixtures, la generación del JSON Schema y la compatibilidad de versiones."
      hints: "packages/project-schema/src; packages/project-schema/schema/project-document.v1.schema.json; packages/project-schema/fixtures"
    - title: "Render worker y protocolo"
      parent: "Arquitectura del sistema"
      goal: "Explicar el protocolo del render worker, sus capacidades, sus mensajes y su relación con el render de la app."
      hints: "apps/render-worker/src/protocol.ts; apps/render-worker/src/capabilities.ts; apps/render-worker/src/index.ts"
    - title: "Edición, timeline y estado"
      goal: "Documentar el modelo de timeline multipista, clips, keyframes, efectos, historial y cómo se aplican las mutaciones."
      hints: "apps/desktop/src/state; packages/project-schema/src/keyframes.ts; packages/project-schema/src/effects.ts; apps/desktop/src/pages"
    - title: "Pipeline de render y export"
      goal: "Explicar la construcción del grafo FFmpeg, el orden de filtros, el export atómico, la verificación con FFprobe y el manejo de audio y subtítulos."
      hints: "apps/desktop/src-tauri/src/render/ffmpeg.rs; apps/desktop/src-tauri/src/render/subtitles.rs; apps/desktop/src-tauri/src/commands/render.rs"
    - title: "Funciones de IA y automatización"
      goal: "Inventariar AI Hub, Director, Auto Shorts, Fábrica de variantes, localización, doblaje, clonación y lip-sync; separar lo local de lo remoto y lo verificado de lo pendiente."
      hints: "docs/reference/CREATION-STUDIO-AI-HUB-2026-10-22.md; apps/desktop/src/features; apps/desktop/src-tauri/src/commands/intelligence.rs; apps/desktop/src-tauri/src/commands/dubbing.rs; scripts/lipsync-engine"
    - title: "Proveedores externos y MCP"
      goal: "Documentar la gestión de MCP, los proveedores de audio y TTS, Google Flow, las credenciales en Windows Credential Manager y las reglas de consentimiento y cuota."
      hints: "apps/desktop/src-tauri/src/commands/mcp.rs; apps/desktop/src-tauri/src/commands/providers.rs; docs/reference/MCP-MANAGER-2026-10-19.md; docs/integrations"
    - title: "Extensiones de navegador"
      goal: "Describir las extensiones MV3 incluidas, sus permisos, su modo de carga y sus límites; no asumir que están instaladas."
      hints: "extensions/flow-queue; extensions/web-tts-bridge; extensions/editor-ia-downloader; docs/integrations"
    - title: "Pruebas, verificación y automatización"
      goal: "Explicar la estrategia de pruebas, los comandos de verificación, el entorno Rust/MSVC y el loop de mejora; no citar números sin medirlos."
      hints: "package.json; scripts/rust-env.mjs; scripts/verify.ps1; docs/automation/BUILD-LOOP.md; vitest.config.ts"
    - title: "Seguridad y privacidad"
      goal: "Documentar el modelo de amenazas local-first, el manejo de secretos, la allowlist IPC, HTTPS y loopback, y las reglas para proveedores externos."
      hints: "SECURITY.md; apps/desktop/src-tauri/tauri.conf.json; apps/desktop/src-tauri/src/commands/mcp.rs"
    - title: "Roadmap y brechas conocidas"
      goal: "Resumir el roadmap y las brechas verificadas sin presentarlas como funciones existentes; enlazar la matriz de paridad y los documentos de referencia."
      hints: "docs/ROADMAP.md; docs/reference/EDITOR-PARITY-MATRIX-2026-10-19.md; docs/reference/CAPCUT-9.4-FEATURE-INVENTORY-2026-10-20.md; docs/reference/DAVINCI-PARITY-2026-10-22.md"

knowledgecard:
  notes:
    - text: "Separar módulos por capa real: UI (`apps/desktop/src`), backend Tauri (`apps/desktop/src-tauri`), contrato de datos (`packages/project-schema`), render worker (`apps/render-worker`) y extensiones (`extensions/*`)."
    - text: "El dueño del contrato de datos es `packages/project-schema`; ninguna tarjeta debe proponer campos fuera de ese esquema sin marcarlo como propuesta."
    - text: "Los comandos IPC son la frontera de seguridad y validación; documentar cada comando con su entrada, salida y errores."
    - text: "Las extensiones y los proveedores externos son opcionales; no los presentes como requisitos del núcleo local-first."
    - text: "Marcar explícitamente lo verificado, lo no verificado y lo planificado; no mezclar roadmap con estado actual."
