<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:hsl(344 45% 16%);stop-opacity:1" />
      <stop offset="100%" style="stop-color:hsl(34 50% 26%);stop-opacity:1" />
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" />
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <rect width="320" height="180" fill="url(#bg)" />
  
    <circle cx="115" cy="85" r="46" fill="hsl(0 80% 60%)" opacity="0.55" />
    <circle cx="205" cy="85" r="46" fill="hsl(120 70% 55%)" opacity="0.45" />
    <circle cx="160" cy="110" r="46" fill="hsl(240 75% 60%)" opacity="0.45" />
</svg>
