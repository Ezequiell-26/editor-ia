<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:hsl(116 45% 16%);stop-opacity:1" />
      <stop offset="100%" style="stop-color:hsl(166 50% 26%);stop-opacity:1" />
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" />
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <rect width="320" height="180" fill="url(#bg)" />
  
    <defs><pattern id="check" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="hsl(116 30% 80%)" /><rect width="12" height="12" fill="hsl(116 30% 60%)" /><rect x="12" y="12" width="12" height="12" fill="hsl(116 30% 60%)" />
    </pattern></defs>
    <rect width="320" height="180" fill="url(#check)" />
    <rect x="95" y="40" width="130" height="100" fill="hsl(116 70% 92%)" opacity="0.65" />
</svg>
