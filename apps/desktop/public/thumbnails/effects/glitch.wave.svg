<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:hsl(287 45% 16%);stop-opacity:1" />
      <stop offset="100%" style="stop-color:hsl(337 50% 26%);stop-opacity:1" />
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" />
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <rect width="320" height="180" fill="url(#bg)" />
  
    <rect x="60" y="50" width="90" height="80" fill="hsl(287 70% 92%)" opacity="0.55" />
    <rect x="170" y="50" width="90" height="80" fill="hsl(287 70% 92%)" opacity="0.35" />
    <rect x="70" y="105" width="180" height="8" fill="hsl(287 70% 92%)" opacity="0.8" />
    <rect x="130" y="60" width="60" height="60" fill="none" stroke="hsl(287 70% 92%)" stroke-width="3" />
</svg>
