[package]
name = "editor-ia-desktop"
version = "0.1.0"
description = "Editor IA Windows desktop application"
authors = ["Editor IA contributors"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "editor_ia_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2" }

[dev-dependencies]
tempfile = "3"
