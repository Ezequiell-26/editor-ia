[package]
name = "editor-ia-desktop"
version = "0.1.0"
description = "Editor IA Windows desktop application"
authors = ["Editor IA contributors"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "editor_ia_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2" }
tauri-plugin-dialog = "2"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
