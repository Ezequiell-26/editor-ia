[package]
name = "editor-ia-desktop"
version = "0.2.0"
edition = "2021"
publish = false
description = "Editor IA: editor de video local-first asistido por IA para Windows."

[lib]
name = "editor_ia_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "editor-ia-desktop"
path = "src/main.rs"
# `src/main.rs` sólo arranca la lib. Desactivar su test evita duplicar el
# manifiesto de recursos cuando `cargo test` enlaza el test de la lib.
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Necesario para que el build de produccion embeba el frontend dentro del
# binario. Sin esta feature el release carga una pagina vacia: el crate `tauri`
# la declara como opcional y NO viene en `default`, y el CLI solo la activa si
# existe en este Cargo.toml.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
ring = "0.17"
md-5 = "0.10"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking", "stream"] }
keyring = { version = "3", features = ["windows-native"] }
uuid = { version = "1", features = ["v4"] }
# Exportador multiplataforma concurrente y tareas de creador.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
# QR offline para el CTA; genera una matriz y la rasterizamos con image.
qrcodegen = "1.8"
# Errores tipados de los módulos de creador, convertidos a ProjectError en IPC.
thiserror = "2"
# Inferencia local (Fase 3): ONNX Runtime via ort. `download-binaries` trae las
# bibliotecas precompiladas al compilar. Licencia MIT/Apache-2.0: permitida.
ort = { version = "2.0.0-rc.15", default-features = false, features = ["load-dynamic"] }
# Decodificar/encodear imágenes para las capacidades de imagen. MIT/Apache-2.0.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
# Detección facial local para smart reframe. BSD-2-Clause, sin DLL externo.
rustface = "0.1.7"
# Decodificación de frames en proceso (MIT/Apache-2.0). Requiere FFmpeg dev.
# `ndarray` entrega el frame en RGB24 y con su timestamp, sin pasar por FFmpeg CLI.
video-rs = { version = "0.12", default-features = false, features = ["ndarray"] }
# Familias tipográficas del sistema vía DirectWrite (selector de fuente de
# subtítulos). Misma versión `windows` que ya trae Tauri: no agrega binario.
windows = { version = "0.62", features = ["Win32_Graphics_DirectWrite"] }
# Validación XML del FCPXML exportado. MIT.
roxmltree = "0.21"
# Lectura de paquetes ZIP para modelos ONNX con pesos externos (MIT).
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
# Cadena de diálogo DSP de FilmCraft (MIT OR Apache-2.0), sin dependencias.
# Se usa desde el repositorio oficial fijado a un commit; no se copia código.
filmcraft-audio-dsp = { git = "https://github.com/storytold/filmcraft", rev = "abf44fda9015f4b7a96dc338f6042499bf8e9d9f", package = "filmcraft-audio-dsp" }
filmcraft-color = { git = "https://github.com/storytold/filmcraft", rev = "abf44fda9015f4b7a96dc338f6042499bf8e9d9f", package = "filmcraft-color" }
filmcraft-scopes = { git = "https://github.com/storytold/filmcraft", rev = "abf44fda9015f4b7a96dc338f6042499bf8e9d9f", package = "filmcraft-scopes" }
filmcraft-tts = { git = "https://github.com/storytold/filmcraft", rev = "abf44fda9015f4b7a96dc338f6042499bf8e9d9f", package = "filmcraft-tts" }
filmcraft-text = { git = "https://github.com/storytold/filmcraft", rev = "abf44fda9015f4b7a96dc338f6042499bf8e9d9f", package = "filmcraft-text" }
filmcraft-captions = { git = "https://github.com/storytold/filmcraft", rev = "abf44fda9015f4b7a96dc338f6042499bf8e9d9f", package = "filmcraft-captions" }
filmcraft-interchange = { git = "https://github.com/storytold/filmcraft", rev = "abf44fda9015f4b7a96dc338f6042499bf8e9d9f", package = "filmcraft-interchange" }
filmcraft-project = { git = "https://github.com/storytold/filmcraft", rev = "abf44fda9015f4b7a96dc338f6042499bf8e9d9f", package = "filmcraft-project" }
filmcraft-media = { git = "https://github.com/storytold/filmcraft", rev = "abf44fda9015f4b7a96dc338f6042499bf8e9d9f", package = "filmcraft-media" }
filmcraft-time = { git = "https://github.com/storytold/filmcraft", rev = "abf44fda9015f4b7a96dc338f6042499bf8e9d9f", package = "filmcraft-time" }
# Crates del engine de Concat vendorados (AGPL-3.0-or-later, ver
# vendor/concat/NOTICE.md). Sólo se declaran los que tienen consumidor
# productivo directo; concat-core/concat-project entran igual por
# transitividad de concat-effects.
# concat-effects: catálogo de efectos (render/ffmpeg/visual/effects.rs).
concat-effects = { path = "../../../vendor/concat/crates/concat-effects" }
# Transcripción in-process con whisper.cpp (concat-speech-min): sólo el
# módulo transcribe de concat-speech, sin TTS/ONNX. Compila whisper.cpp
# con cmake+bindgen en build time (ver vendor/concat/NOTICE.md).
concat-speech-min = { path = "../../../vendor/concat/crates/concat-speech-min" }
# Fuera del árbol de la app por decisión (ADR
# docs/decisions/2026-11-13-concat-vendor-scope.md, opción c): no tienen
# consumidor productivo y sus re-exports sólo alimentaban tests del seam.
# - concat-text (títulos→RGBA): la app resuelve títulos por la vía FFmpeg.
# - concat-log: la app tiene su propio logging.
# - concat-render (plan_frame + compositor wgpu): ~147 crates wgpu sin uso.
#   Reingresa sólo si aparece un consumidor real (compositor GPU).
# - concat-media (FFmpeg in-process, ffmpeg-the-third 6 / FFmpeg 9) está
#   vendorado y verde en vendor/concat, pero NO se declara acá:
#   ffmpeg-sys-the-third y ffmpeg-sys-next (vía video-rs) ambos declaran
#   `links = "ffmpeg"` y no pueden coexistir en un binario. Integrarlo
#   exige unificar el binding FFmpeg — decisión de arquitectura pendiente.
# - concat-export quedó afuera: depende de concat-vision (ONNX Runtime),
#   que no se vendoriza.

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "net", "io-util"] }
